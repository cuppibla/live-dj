<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial">
  <defs>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arwP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="1600" height="950" fill="#FFFFFF"/>

  <text x="70" y="62" font-size="34" font-weight="700" fill="#0F172A">live-dj — one spoken sentence, end to end</text>
  <text x="70" y="98" font-size="20" fill="#64748B">The browser owns the audio. The server owns the socket. The model owns the turn.</text>

  <!-- ===== containers ===== -->
  <rect x="60" y="150" width="360" height="550" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="85" y="182" font-size="14" font-family="'SF Mono', Menlo, Consolas" fill="#334155">frontend/ · browser</text>

  <rect x="600" y="150" width="400" height="550" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="625" y="182" font-size="14" font-family="'SF Mono', Menlo, Consolas" fill="#334155">genai_sdk/raw_server.py · FastAPI :8000</text>

  <rect x="1180" y="150" width="360" height="550" rx="18" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1205" y="182" font-size="14" font-family="'SF Mono', Menlo, Consolas" fill="#334155">Google · Gemini Live API</text>

  <!-- ===== browser boxes ===== -->
  <rect x="85" y="250" width="310" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="105" y="281" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">pcm-processor.js</text>
  <text x="105" y="305" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">AudioWorklet · → 16 kHz Int16</text>

  <rect x="85" y="430" width="310" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="105" y="461" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">playVoice()</text>
  <text x="105" y="485" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">24 kHz PCM · gapless</text>

  <rect x="85" y="570" width="310" height="72" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="105" y="600" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">&lt;audio&gt; music</text>
  <text x="105" y="624" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">ducks to 0.12 · 450 ms</text>

  <!-- ===== server boxes ===== -->
  <rect x="625" y="250" width="350" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="645" y="281" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">upstream()</text>
  <text x="645" y="305" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">send_realtime_input(Blob)</text>

  <rect x="625" y="420" width="350" height="100" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="645" y="451" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">downstream()</text>
  <text x="645" y="475" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">while True: session.receive()</text>
  <text x="645" y="497" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">voice · transcripts · interrupted</text>

  <rect x="625" y="570" width="350" height="72" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="645" y="600" font-size="15" font-family="'SF Mono', Menlo, Consolas" fill="#0F172A">tools.py</text>
  <text x="645" y="624" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">play · skip · pause — instant</text>

  <!-- ===== the model ===== -->
  <rect x="1205" y="260" width="310" height="250" rx="14" fill="url(#llm)"/>
  <text x="1235" y="330" font-size="22" font-weight="600" font-family="'SF Mono', Menlo, Consolas" fill="#FFFFFF">✦ Gemini Live</text>
  <text x="1235" y="374" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#E9E5FF">gemini-3.1-flash-live-preview</text>
  <text x="1235" y="412" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#E9E5FF">native audio · voice Aoede</text>
  <text x="1235" y="440" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#E9E5FF">VAD · transcriptions</text>
  <text x="1235" y="468" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#E9E5FF">function calling</text>

  <!-- ===== ① mic up ===== -->
  <line x1="395" y1="290" x2="618" y2="290" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="506" y="274" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">16 kHz PCM · /ws</text>
  <circle cx="506" cy="290" r="15" fill="#0F172A"/>
  <text x="506" y="295" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- ===== ② to model ===== -->
  <line x1="975" y1="290" x2="1198" y2="290" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="1086" y="274" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">audio/pcm;rate=16000</text>
  <circle cx="1086" cy="290" r="15" fill="#0F172A"/>
  <text x="1086" y="295" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- ===== ③ model back ===== -->
  <line x1="1198" y1="470" x2="982" y2="470" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="1090" y="454" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">session.receive()</text>
  <circle cx="1090" cy="470" r="15" fill="#0F172A"/>
  <text x="1090" y="475" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- ===== ④ voice to speakers ===== -->
  <line x1="618" y1="470" x2="402" y2="470" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="510" y="454" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">24 kHz voice bytes</text>
  <circle cx="510" cy="470" r="15" fill="#0F172A"/>
  <text x="510" y="475" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- ===== ⑤ tool call round trip ===== -->
  <line x1="800" y1="520" x2="800" y2="563" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>
  <text x="818" y="548" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B">tool_call</text>
  <circle cx="770" cy="543" r="15" fill="#0F172A"/>
  <text x="770" y="548" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <path d="M 975 606 H 1300 V 517" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>
  <text x="1140" y="596" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">send_tool_response</text>

  <!-- ===== ⑥ play command ===== -->
  <line x1="618" y1="606" x2="402" y2="606" stroke="#94A3B8" stroke-width="2" marker-end="url(#arw)"/>
  <text x="510" y="590" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#64748B" text-anchor="middle">{"type":"play"}</text>
  <circle cx="510" cy="606" r="15" fill="#0F172A"/>
  <text x="510" y="611" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>

  <!-- ===== ⑦ barge-in (the star edge) ===== -->
  <line x1="240" y1="330" x2="240" y2="423" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arwP)"/>
  <text x="258" y="365" font-size="13" font-weight="700" font-family="'SF Mono', Menlo, Consolas" fill="#8B5CF6">RMS ≥ 0.02</text>
  <text x="258" y="386" font-size="13" font-family="'SF Mono', Menlo, Consolas" fill="#8B5CF6">cut playback</text>
  <circle cx="205" cy="376" r="15" fill="#8B5CF6"/>
  <text x="205" y="381" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>

  <!-- ===== legend ===== -->
  <rect x="70" y="736" width="22" height="16" rx="4" fill="url(#llm)"/>
  <text x="102" y="749" font-size="14" fill="#64748B">the model</text>
  <rect x="212" y="736" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="244" y="749" font-size="14" fill="#64748B">your code</text>
  <line x1="356" y1="744" x2="404" y2="744" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="414" y="749" font-size="14" fill="#64748B">audio stream</text>
  <line x1="540" y1="744" x2="588" y2="744" stroke="#94A3B8" stroke-width="2"/>
  <text x="598" y="749" font-size="14" fill="#64748B">call / command</text>
  <line x1="740" y1="744" x2="788" y2="744" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="798" y="749" font-size="14" fill="#8B5CF6">barge-in (client-side)</text>

  <!-- ===== the one caveat ===== -->
  <rect x="60" y="790" width="1480" height="96" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="90" y="828" font-size="17" font-weight="700" fill="#92400E">③ session.receive() is a PER-TURN generator — it ends when the model finishes one reply.</text>
  <text x="90" y="860" font-size="16" fill="#B45309">Iterate it once and your agent answers a single sentence, then goes silent forever. It needs the outer while True. That is the whole EP1 gotcha.</text>
</svg>
